name: Release Chrome extension

# 两种触发方式：
#   1) 人工推送 v* tag（push 事件）
#   2) 被 auto-tag.yml 以 workflow_call 复用
# 为什么需要第 2 种：用仓库自带的 GITHUB_TOKEN 推 tag 不会触发 push 事件
# （GitHub 规定：GITHUB_TOKEN 造成的事件不会再创建新的 workflow run），
# 所以「合并后自动发版」必须直接调用本流程，而不是指望 tag 去触发它。
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 要构建并发布的 tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - name: Align build version with tag
        # 自动打的 tag 不会改仓库里的 package.json，这里让构建产物的版本号跟随 tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          export VERSION="${TAG#v}"
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            for (const file of ['package.json', 'package-lock.json']) {
              if (!fs.existsSync(file)) continue;
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              if (json.packages && json.packages['']) json.packages[''].version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            console.log('构建版本号 ->', version);
          "
      - run: npm run zip
      - name: Locate zip
        id: artifact
        run: |
          FILE=$(find .output -name '*chrome*.zip' | head -n 1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ steps.artifact.outputs.file }}
          generate_release_notes: true
          body: |
            Chrome 插件安装包：下载 `${{ steps.artifact.outputs.name }}` 后，在 `chrome://extensions` 打开开发者模式，选择「加载已解压的扩展程序」，或将 zip 解压后加载。
