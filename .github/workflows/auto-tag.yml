name: Auto patch tag on merge

# PR 合并进 main 后自动发版：
#   1) 在合并提交上打一个补丁版本 tag（vX.Y.Z → vX.Y.(Z+1)）
#   2) 直接复用 release.yml 构建 zip 并创建 Release
#
# 第 2 步为什么不是「等 tag 触发 release.yml」：GitHub 规定用仓库自带的
# GITHUB_TOKEN 推 tag 不会触发 push 事件（GITHUB_TOKEN 造成的事件不会再创建
# 新的 workflow run），所以这里用 workflow_call 显式调用同一个 release 流程。
# 想换成「推 tag 就自动出包」的分离形态，也可以改用 PAT / GitHub App token 来推
# tag（需要配 secret），二者选一即可。
#
# 说明：
# - 跳过发版：给 PR 加 `skip-release` 标签，或自己手动把 tag 打上（HEAD 已有 tag 就跳过）。
# - 需要仓库 Settings → Actions → Workflow permissions 允许读写（本文件已声明 contents: write）。
# - 来自 fork 的 PR 合并时 GITHUB_TOKEN 只读，推 tag 会失败；仓库内分支不受影响。
# - 补救办法：删掉远端 tag 再用自己的凭据重推一次，即可触发 release.yml 补发。
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'skip-release')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push next patch tag
        id: next
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          existing=$(git tag --points-at HEAD)
          if [ -n "$existing" ]; then
            echo "合并提交上已有 tag（$existing），跳过"
            exit 0
          fi

          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            echo "仓库里还没有 vX.Y.Z 形式的 tag，首次发版请手动打 tag"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${latest#v}"
          for part in "$major" "$minor" "$patch"; do
            if ! [[ "$part" =~ ^[0-9]+$ ]]; then
              echo "最新 tag $latest 不是三段纯数字版本，无法自动 +1，请手动打 tag" >&2
              exit 1
            fi
          done

          next="v${major}.${minor}.$((patch + 1))"
          echo "最新 tag：$latest → 新 tag：$next"
          git tag -a "$next" -m "Release $next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    # 跳过分版（HEAD 已有 tag / 没有可用 tag）时不打 Release
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
